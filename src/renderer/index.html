<!DOCTYPE html>
<html lang="pl">

<head>

    <meta charset="UTF-8">

    <meta
        http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data:;"
    >

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Classic Heroes</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

<main class="launcher">

    <div class="window-controls">

        <button
            id="minimizeButton"
            type="button"
        >
            ─
        </button>

        <button
            id="closeButton"
            type="button"
        >
            ×
        </button>

    </div>

    <div class="language">

        <button
            id="plButton"
            class="language-button active"
            type="button"
        >
            PL
        </button>

        <button
            id="frButton"
            class="language-button"
            type="button"
        >
            FR
        </button>

        <button
            id="enButton"
            class="language-button"
            type="button"
        >
            EN
        </button>

    </div>

    <img
        class="logo"
        src="../../assets/logo.png"
        alt="Classic Heroes"
    >

    <div class="content">

        <h1>
            CLASSIC HEROES
        </h1>

        <p id="subtitle">
            Wprowadź swój token sesji
        </p>

        <div class="token-container">

            <input
                id="tokenInput"
                type="password"
                placeholder="Token sesji"
                autocomplete="off"
            >

            <button
                id="showTokenButton"
                type="button"
            >
                👁
            </button>

        </div>

        <button
            id="playButton"
            type="button"
            disabled
        >
            GRAJ
        </button>

        <div class="download-container">

            <div id="downloadStatus">
                Sprawdzanie gry...
            </div>

            <div class="progress">

                <div
                    id="progressBar"
                    class="progress-bar"
                ></div>

            </div>

            <div id="downloadInfo">
                0%
            </div>

        </div>

        <p id="status">
            Gotowy
        </p>

    </div>

</main>

<script src="app.js"></script>

</body>

</html>
